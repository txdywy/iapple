name: Update Apple Data and Deploy

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Trust Apple root certificates
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://www.apple.com/appleca/AppleIncRootCertificate.cer \
            --output /tmp/AppleIncRootCertificate.cer
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/AppleRootCA-G2.cer \
            --output /tmp/AppleRootCA-G2.cer
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/AppleRootCA-G3.cer \
            --output /tmp/AppleRootCA-G3.cer
          openssl x509 -inform DER -in /tmp/AppleIncRootCertificate.cer -out /tmp/AppleIncRootCertificate.crt
          openssl x509 -inform DER -in /tmp/AppleRootCA-G2.cer -out /tmp/AppleRootCA-G2.crt
          openssl x509 -inform DER -in /tmp/AppleRootCA-G3.cer -out /tmp/AppleRootCA-G3.crt
          sudo cp /tmp/AppleIncRootCertificate.crt /usr/local/share/ca-certificates/AppleIncRootCertificate.crt
          sudo cp /tmp/AppleRootCA-G2.crt /usr/local/share/ca-certificates/AppleRootCA-G2.crt
          sudo cp /tmp/AppleRootCA-G3.crt /usr/local/share/ca-certificates/AppleRootCA-G3.crt
          sudo update-ca-certificates

      - name: Fetch Apple update data
        env:
          NODE_OPTIONS: --use-openssl-ca
        run: npm run fetch:data

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
